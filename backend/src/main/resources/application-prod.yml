spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tarot_prod_db?useSSL=true&requireSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TarotProdHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000

logging:
  level:
    root: INFO
    com.tarotplatform: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
