spring:
  application:
    name: tarot-consultation-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 hours
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    key: ${PAYMENT_PROVIDER_KEY:mock_key_test}
    secret: ${PAYMENT_PROVIDER_SECRET:mock_secret_test}
