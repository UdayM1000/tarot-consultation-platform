name: tarot_consultation_app
description: "A premium Tarot & Rune consultation customer application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Secure Storage for JWT
  flutter_secure_storage: ^9.2.2

  # Date & Time formatting
  intl: ^0.19.0

  # Image caching
  cached_network_image: ^3.3.1

  # UI & Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
